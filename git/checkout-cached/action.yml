name: 'Checkout (repository-cache aware)'
description: >-
  Drop-in replacement for actions/checkout. When the runner has a
  git-repository-cache configured for this repository (GIT_REPOSITORY_CACHE_URL and
  GIT_REPOSITORY_CACHE_REPOSITORIES env vars), this fetches that repository's
  manifest, downloads the pack/idx/refs files it lists straight into a fresh
  .git directory (no client-side re-indexing), then hands off to
  actions/checkout, which recognizes the pre-seeded .git directory and fetches
  only the delta on top of it, regardless of the requested fetch-depth. Skips
  seeding for repositories not listed in GIT_REPOSITORY_CACHE_REPOSITORIES,
  when GIT_REPOSITORY_CACHE_URL isn't set (the kill switch), or on any
  repository-cache failure or timeout - actions/checkout re-clones from
  scratch whenever the seeded directory isn't usable, so this is always safe.

  The repository-cache authorizes each request against the token used to fetch
  it (default: github.token, scoped to this job's own repository). This
  isolation only holds for that default: a caller-supplied broader
  `token` (a custom PAT or GitHub App token with wider access) legitimately
  unlocks whatever that token can read on the repository-cache too - the same
  trust model actions/checkout itself has for its own `token` input, not a
  gap introduced here.

inputs:
  repository:
    description: 'Repository name with owner, matches actions/checkout'
    required: false
    default: ${{ github.repository }}
  ref:
    description: 'Branch, tag or SHA to checkout, matches actions/checkout'
    required: false
    default: ''
  token:
    description: 'Token used to fetch the repository, matches actions/checkout'
    required: false
    default: ${{ github.token }}
  path:
    description: 'Relative path under $GITHUB_WORKSPACE to checkout to, matches actions/checkout'
    required: false
    default: ''
  fetch-depth:
    description: 'Forwarded to actions/checkout, matches actions/checkout'
    required: false
    default: '1'
  fetch-tags:
    description: 'Forwarded to actions/checkout, matches actions/checkout'
    required: false
    default: 'false'
  filter:
    description: 'Forwarded to actions/checkout, matches actions/checkout'
    required: false
    default: ''
  sparse-checkout:
    description: 'Newline-separated cone patterns, matches actions/checkout'
    required: false
    default: ''
  sparse-checkout-cone-mode:
    description: 'Whether sparse-checkout uses cone mode, matches actions/checkout'
    required: false
    default: 'true'
  persist-credentials:
    description: 'Whether to leave the auth token in the local git config for later steps, matches actions/checkout'
    required: false
    default: 'true'

outputs:
  used-repository-cache:
    description: 'true if the local clone was seeded from a git-repository-cache, false if actions/checkout did a plain full clone'
    value: ${{ steps.cache-seed.outputs.succeeded == 'true' && 'true' || 'false' }}

runs:
  using: 'composite'
  steps:
    - name: Decide whether to attempt the repository cache
      id: decide
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        attempt='true'
        reason=''

        if [ -z "${GIT_REPOSITORY_CACHE_URL:-}" ]; then
          attempt='false'
          reason='GIT_REPOSITORY_CACHE_URL is not set on this runner'
        elif ! printf '%s\n' "${GIT_REPOSITORY_CACHE_REPOSITORIES:-}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -qxF "$REPOSITORY"; then
          attempt='false'
          reason="${REPOSITORY} is not in GIT_REPOSITORY_CACHE_REPOSITORIES"
        fi

        echo "attempt=${attempt}" >> "$GITHUB_OUTPUT"
        if [ "$attempt" = 'false' ]; then
          echo "Skipping git-repository-cache: ${reason}" >&2
        fi

    - name: Seed local clone from git-repository-cache
      id: cache-seed
      if: steps.decide.outputs.attempt == 'true'
      shell: bash
      continue-on-error: true
      env:
        CHECKOUT_REPOSITORY: ${{ inputs.repository }}
        CHECKOUT_PATH: ${{ inputs.path }}
        CHECKOUT_TOKEN: ${{ inputs.token }}
        CHECKOUT_REF: ${{ inputs.ref }}
      run: |
        set -uo pipefail

        cache_url="${GIT_REPOSITORY_CACHE_URL:-}"
        expected_manifest_format_version='1'

        # Subshell with its own `set -e`: any failure aborts the whole attempt
        # without ever failing this step - actions/checkout re-clones instead.
        attempt_cache_seed() (
          set -euo pipefail

          if [ -z "$cache_url" ]; then
            echo "GIT_REPOSITORY_CACHE_URL is not set on this runner" >&2
            exit 1
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq is required to parse the git-repository-cache manifest" >&2
            exit 1
          fi

          # Forwarded to the repository-cache's auth check, which forwards it on to
          # github.com's own probe - same Basic-auth-with-token form git uses.
          auth_header="Basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"

          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT

          curl --fail --silent --show-error --connect-timeout 3 --max-time 10 \
            -H "Authorization: ${auth_header}" \
            -o "${work_dir}/manifest.json" "${cache_url}/repos/${CHECKOUT_REPOSITORY}/manifest"

          manifest_version="$(jq -r '.format_version' "${work_dir}/manifest.json")"
          if [ "$manifest_version" != "$expected_manifest_format_version" ]; then
            echo "git-repository-cache manifest format version mismatch: got ${manifest_version}, expected ${expected_manifest_format_version}" >&2
            exit 1
          fi

          generation="$(jq -r '.generation' "${work_dir}/manifest.json")"
          refs_path="$(jq -r '.refs.path' "${work_dir}/manifest.json")"
          refs_sha="$(jq -r '.refs.sha256' "${work_dir}/manifest.json")"
          pack_count="$(jq -r '.packs | length' "${work_dir}/manifest.json")"

          if [ -z "$generation" ] || [ "$generation" = 'null' ] || [ "$pack_count" -eq 0 ]; then
            echo "git-repository-cache manifest for ${CHECKOUT_REPOSITORY} is malformed or lists no packs" >&2
            exit 1
          fi

          # Downloads $2 into $3 and verifies it against the manifest's checksum -
          # the manifest is the single trust anchor for these files.
          fetch_and_verify() (
            set -euo pipefail
            remote_path="$1"
            expected_sha="$2"
            dest_file="$3"
            max_time="$4"
            curl --fail --silent --show-error --connect-timeout 3 --max-time "$max_time" \
              -H "Authorization: ${auth_header}" \
              -o "$dest_file" "${cache_url}/repos/${CHECKOUT_REPOSITORY}/${generation}/${remote_path}"
            actual_sha="$(sha256sum "$dest_file" | awk '{print $1}')"
            if [ "$expected_sha" != "$actual_sha" ]; then
              echo "git-repository-cache checksum mismatch for ${remote_path}: got ${actual_sha}, expected ${expected_sha}" >&2
              exit 1
            fi
          )

          fetch_and_verify "$refs_path" "$refs_sha" "${work_dir}/repo.refs" 10

          i=0
          while [ "$i" -lt "$pack_count" ]; do
            pack_path="$(jq -r ".packs[$i].pack" "${work_dir}/manifest.json")"
            idx_path="$(jq -r ".packs[$i].idx" "${work_dir}/manifest.json")"
            pack_sha="$(jq -r ".packs[$i].pack_sha256" "${work_dir}/manifest.json")"
            idx_sha="$(jq -r ".packs[$i].idx_sha256" "${work_dir}/manifest.json")"
            fetch_and_verify "$pack_path" "$pack_sha" "${work_dir}/${pack_path}" 120
            fetch_and_verify "$idx_path" "$idx_sha" "${work_dir}/${idx_path}" 30
            i=$((i + 1))
          done

          # Only .git needs seeding; actions/checkout does the working-tree checkout.
          dest="${CHECKOUT_PATH:-.}"
          timeout 10 git init --quiet "$dest"
          mkdir -p "${dest}/.git/objects/pack"

          i=0
          while [ "$i" -lt "$pack_count" ]; do
            pack_path="$(jq -r ".packs[$i].pack" "${work_dir}/manifest.json")"
            idx_path="$(jq -r ".packs[$i].idx" "${work_dir}/manifest.json")"
            mv "${work_dir}/${pack_path}" "${dest}/.git/objects/pack/"
            mv "${work_dir}/${idx_path}" "${dest}/.git/objects/pack/"
            i=$((i + 1))
          done
          mv "${work_dir}/repo.refs" "${dest}/.git/packed-refs"

          # actions/checkout only reuses an existing .git dir if remote.origin.url
          # exactly matches what it would set itself (url-helper.ts#getFetchUrl);
          # getting this wrong just means a re-clone, not a correctness bug.
          git -C "$dest" remote add origin "https://github.com/${CHECKOUT_REPOSITORY}"

          # `git init` leaves HEAD -> refs/heads/master, which no longer exists
          # once every refs/heads/* above got remapped to refs/remotes/origin/*
          # (git-repository-cache/entrypoint-configmap.yaml, to avoid the
          # branch-delete-flood actions/checkout used to do). An unresolvable
          # HEAD makes actions/checkout's own `git reset --hard HEAD`
          # (git-directory-helper.ts) fail, so it discards this entire seed and
          # re-clones from scratch. Detach HEAD to a real commit so that reset
          # succeeds; actions/checkout rewrites HEAD to the actual target ref
          # right after via its own `git checkout -B`, so which commit we pick
          # here only affects whether that rewrite is a no-op or a second full
          # checkout, never correctness.
          candidate_ref="${CHECKOUT_REF:-${GITHUB_REF_NAME:-}}"
          head_sha=''
          if [ -n "$candidate_ref" ]; then
            case "$candidate_ref" in
              refs/*) ;;
              *) candidate_ref="refs/heads/${candidate_ref}" ;;
            esac
            case "$candidate_ref" in
              refs/heads/*) lookup="refs/remotes/origin/${candidate_ref#refs/heads/}" ;;
              *) lookup="$candidate_ref" ;;
            esac
            head_sha="$(awk -v r="$lookup" '$2==r{print $1; exit}' "${dest}/.git/packed-refs")"
          fi
          if [ -z "$head_sha" ]; then
            head_sha="$(awk 'NF==2{print $1; exit}' "${dest}/.git/packed-refs")"
          fi
          if [ -n "$head_sha" ]; then
            git -C "$dest" update-ref --no-deref HEAD "$head_sha"
          fi

          echo "Seeded ${dest} from git-repository-cache generation ${generation} (${pack_count} pack(s)), handing off to actions/checkout"
        )

        # Deliberately not `if attempt_cache_seed; then`: bash ignores `set -e`
        # for a function's entire call tree when the call is itself an if/&&/||
        # condition, so a failure deep inside would silently look like success.
        # Calling it as a bare statement isn't enough either, since GitHub's own
        # `shell: bash` steps already run under `-e` (would abort before
        # `seed_status=$?` runs) - toggle that off for the call instead.
        set +e
        attempt_cache_seed
        seed_status=$?
        set -e
        if [ "$seed_status" -eq 0 ]; then
          echo "succeeded=true" >> "$GITHUB_OUTPUT"
        else
          echo "git-repository-cache seed failed, actions/checkout will do a plain full clone" >&2
          echo "succeeded=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout via actions/checkout
      id: checkout
      # Always runs: reuses the seeded .git dir (fetch just the delta) when
      # cache-seed succeeded, otherwise clones from scratch as usual.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        path: ${{ inputs.path }}
        fetch-depth: ${{ inputs.fetch-depth }}
        fetch-tags: ${{ inputs.fetch-tags }}
        filter: ${{ inputs.filter }}
        sparse-checkout: ${{ inputs.sparse-checkout }}
        sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}
        persist-credentials: ${{ inputs.persist-credentials }}
