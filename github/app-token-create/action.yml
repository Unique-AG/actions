name: "Create GitHub App Token"
description: "Decodes a base64-encoded private key and generates a GitHub App token"

inputs:
  app_id:
    description: "GitHub App ID"
    required: true
  base64_encoded_private_key:
    description: "Base64-encoded GitHub App private key"
    required: true
  owner:
    description: "GitHub repository owner"
    required: false
    default: ${{ github.repository_owner }}
  repositories:
    description: "Repositories to grant access to (optional)"
    required: false
    default: ""

outputs:
  token:
    description: "GitHub App token"
    value: ${{ steps.app-token.outputs.token }}

runs:
  using: "composite"
  steps:
    - name: Decode base64-encoded private key
      id: decode-private-key
      shell: bash
      env:
        BASE64_ENCODED_PRIVATE_KEY: ${{ inputs.base64_encoded_private_key }}
      run: |
        # Disable command tracing to prevent key from being printed
        set -euo pipefail
        set +x

        # Catch empty inputs early. Without this, an unset/empty secret slips
        # all the way through to ``actions/create-github-app-token`` which then
        # signs a JWT against an empty key — GitHub's response is the cryptic
        # ``A JSON web token could not be decoded`` 401 from
        # ``GET /users/<owner>/installation``, with no hint that the root cause
        # is the workflow's secret wiring.
        if [[ -z "${BASE64_ENCODED_PRIVATE_KEY:-}" ]]; then
          echo "::error::Input 'base64_encoded_private_key' is empty. Verify the secret is set in the calling repo/environment and the job declares the right 'environment:' block."
          exit 1
        fi

        # Decode the base64-encoded private key (stored as base64 in AWS
        # Secrets Manager because its key/value mode does not handle line breaks)
        BASE64_DECODED_PRIVATE_KEY=$(echo -n "$BASE64_ENCODED_PRIVATE_KEY" | base64 -d)

        # Validate the decoded value is actually a PEM private key. ``base64 -d``
        # is permissive: an upload mistake (raw PEM stored unencoded, Python
        # ``b'...'`` repr, double-encoding, CRLF line-folding) often still
        # decodes without error but yields garbage. That garbage propagates
        # silently and surfaces much later as ``A JSON web token could not be
        # decoded`` from GitHub's API. Failing loudly here turns the next bad
        # upload into a one-line, actionable error instead of a multi-day
        # forensic exercise across half a dozen workflows.
        case "$BASE64_DECODED_PRIVATE_KEY" in
          "-----BEGIN "*"PRIVATE KEY-----"*) ;;
          *)
            echo "::error::Decoded 'base64_encoded_private_key' is not a PEM private key (expected to start with '-----BEGIN ... PRIVATE KEY-----'). Re-upload the App's .pem file as raw base64 (no quotes, no Python repr, no line breaks)."
            exit 1
            ;;
        esac

        # Register the decoded PEM key with the runner's log-redaction filter.
        # ::add-mask:: is a single-line workflow command, so multiline values
        # must be encoded: %25 for %, %0D for \r, %0A for \n — matching the
        # escapeData logic in @actions/core. A single atomic mask avoids
        # false-positive redaction of short base64 fragments that could match
        # unrelated log lines.
        echo "::add-mask::$(echo "$BASE64_DECODED_PRIVATE_KEY" | sed ':a;N;$!ba;s/%/%25/g' | sed ':a;N;$!ba;s/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')"

        # Pass decoded key to the next step via GITHUB_OUTPUT (multiline heredoc)
        {
          echo "decoded_private_key<<PRIVATE_KEY_EOF"
          printf '%s\n' "$BASE64_DECODED_PRIVATE_KEY"
          echo "PRIVATE_KEY_EOF"
        } >> $GITHUB_OUTPUT 2>/dev/null

        # Clear variables from shell namespace
        unset BASE64_ENCODED_PRIVATE_KEY
        unset BASE64_DECODED_PRIVATE_KEY

    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ steps.decode-private-key.outputs.decoded_private_key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
