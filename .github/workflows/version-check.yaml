name: Version Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read # to read the repository

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit and its base parent
          persist-credentials: false

      - name: Require a new version for every changed action
        shell: bash
        run: |
          # --no-renames lists both sides of a move, so the source action counts too
          git diff --name-only --no-renames HEAD^1 HEAD > files.txt

          # map each changed file to the nearest folder holding an action; removed actions drop out
          while read -r path; do
            dir=$(dirname "$path")
            while [ "$dir" != . ] && [ ! -f "$dir/action.yml" ] && [ ! -f "$dir/action.yaml" ]; do dir=$(dirname "$dir"); done
            [ "$dir" = . ] || echo "$dir"
          done < files.txt | sort -u > changed.txt

          failed=0
          while read -r dir; do
            file="$dir/version.yaml"
            if [ ! -f "$file" ]; then
              echo "::error::$dir has no version.yaml."
              failed=1
              continue
            fi
            if ! yq -e '.name and .version and (.changes | length > 0)' "$file" >/dev/null; then
              echo "::error file=$file::Set name, version and at least one change."
              failed=1
              continue
            fi
            tag="$(yq '.name' "$file")@$(yq '.version' "$file")"
            base=$(git show "HEAD^1:$file" 2>/dev/null || true)
            released=$(git ls-remote origin "refs/tags/$tag") # a plain assignment, so a failed lookup stops the step
            if [ -n "$released" ]; then
              echo "::error file=$file::$tag is already released, bump version."
              failed=1
            elif [ -n "$base" ] && [ "$(yq '.version' <<< "$base")" = "$(yq '.version' "$file")" ]; then
              echo "::error file=$file::Bump version for the changes to $dir."
              failed=1
            elif [ -n "$base" ] && [ "$(yq -o json '.changes' <<< "$base")" = "$(yq -o json '.changes' "$file")" ]; then
              echo "::error file=$file::Replace changes with the changes of this version."
              failed=1
            else
              echo "$dir is at a new version."
            fi
          done < changed.txt
          exit "$failed"
