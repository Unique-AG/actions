name: Version Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read # to read the repository and its releases
  pull-requests: read # to list the changed files

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a new version for every changed action
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # map each changed file to the nearest folder holding a version.yaml
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only | while read -r path; do
            dir=$(dirname "$path")
            while [ "$dir" != . ] && [ ! -f "$dir/version.yaml" ]; do dir=$(dirname "$dir"); done
            [ "$dir" = . ] || echo "$dir"
          done | sort -u > changed.txt

          failed=0
          while read -r dir; do
            tag="$(yq '.name' "$dir/version.yaml")@$(yq '.version' "$dir/version.yaml")"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error file=$dir/version.yaml::$tag is already released, bump version and add changes."
              failed=1
            else
              echo "$tag is new."
            fi
          done < changed.txt
          exit "$failed"
